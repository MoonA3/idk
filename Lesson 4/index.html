<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Bài tập</title>
    <link rel="stylesheet" href="btxs.css">
</head>
<body>

    <div class="header">
        <span class="logo">TECH / STORE</span>
        <span class="menu">Sản phẩm · Ưu đãi · Hỗ trợ</span>
        
        <div class="cart-box">
            <button class="cart-button">Giỏ hàng</button>
            <span class="cart-badge">0</span>
        </div>
    </div>

    <div class="container">
        <p class="subtitle">NEW COLLECTION</p>
        <h1 class="title">Gear tốt hơn.</h1>
        <h1 class="title">Học tập tập trung hơn.</h1>
        <p class="desc">Thiết bị được chọn cho góc làm việc của sinh viên công nghệ.</p>
        <button class="nut">Khám phá sản phẩm</button>
    </div>

    <h2>Sản phẩm nổi bật</h2>

    <div class="product-list">
        <div class="product-card">
            <span class="badge">-10%</span>
            <div class="product-img-box">
                <img src="./keyboard.jpg" alt="Nova Keyboard">
            </div>
            <h3>Nova Keyboard</h3>
            <p class="price">1.290.000đ</p>
        </div>

        <div class="product-card">
            <span class="badge">-15%</span>
            <div class="product-img-box">
                <img src="./headphones.jpg" alt="Pulse Headphones">
            </div>
            <h3>Pulse Headphones</h3>
            <p class="price">890.000đ</p>
        </div>
        <div class="product-card">
            <span class="badge">-20%</span>
            <div class="product-img-box">
                <img src="./light.jpg" alt="Orbit Desk Light">
            </div>
            <h3>Orbit Desk Light</h3>
            <p class="price">490.000đ</p>
        </div>

    </div>

</body>
</html>
