<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTVN Lesson 2</title>
    <link rel="stylesheet" href="btvn.css">
</head>
<body>
    <div class="header">
        <span class="logo" style="padding-left: 0px;">TECH/STORE</span>
        <span class="menu" style="padding-left: 600px;">Sản phẩm - Ưu đãi - Hỗ trợ</span>
        <button class="cart-button">Giỏ hàng</button>
    </div>

    <div class="container">
        <p style="font-size: 12px;">NEW COLLECTION</p>
        <p style="font-weight: bold; font-size: 24px">Gear tốt hơn</p>
        <p style="font-weight: bold; font-size: 24px">Học tập tập trung hơn</p>
        <p style="color: rgb(205, 224, 245);">Thiết bị được chọn cho góc làm việc của sinh viên công nghệ.</p>
        <button class="nut">Khám phá sản phẩm</button>
    </div>
    <h2>Sản phẩm nổi bật</h2>
    <div class="keyboard">
        <img src="./keyboard.jpg" alt="Wireless keyboard" style="width: 200px; height: 100px; text-align: center;">
        <h3 style="text-align: left;">Wireless keyboard</h3>
        <p style="font-weight: bold; text-align: left;">1.000.000đ</p>
    </div>

    <div class="headphones">
        <img src="./headphones.jpg" alt="Wireless headphones" style="width: 200px; height: 100px;">
        <h3 style="text-align: left;">Headphones</h3>
        <p style="font-weight: bold; text-align: left;">750.000đ</p>
    </div>
</body>
</html>
