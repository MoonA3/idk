<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTVN Lesson 2</title>
    <link rel="stylesheet" href="btxs.css">
</head>
<body>
    <div class="header">
        <span class="logo">TECH/STORE</span>
        <span class="menu">Sản phẩm - Ưu đãi - Hỗ trợ</span>
        <div class="cart-box">
        <button class="cart-button">Giỏ hàng</button>
        <span class="cart-badge">0</span>
    </div>
    </div>

    <div class="container">
        <p style="font-size: 12px; margin-bottom: 5px;">NEW COLLECTION</p>
        <p style="font-weight: bold; font-size: 24px; margin: 5px 0;">Gear tốt hơn.</p>
        <p style="font-weight: bold; font-size: 24px; margin: 5px 0;">Học tập tập trung hơn.</p>
        <p style="color: rgb(205, 224, 245); margin-top: 10px;">Thiết bị được chọn cho góc làm việc của sinh viên công nghệ.</p>
        <button class="nut">Khám phá sản phẩm</button>
    </div>

    <h2>Sản phẩm nổi bật</h2>
    <div class="keyboard">
        <span class="badge">-10%</span>
        <div class="product-img-box">
            <img src="./keyboard.jpg" alt="Wireless keyboard">
        </div>
        <h3>Wireless keyboard</h3>
        <p style="font-weight: bold;">1.000.000đ</p>
    </div>

    <div class="headphones">
        <span class="badge">-15%</span>
        <div class="product-img-box">
            <img src="./headphones.jpg" alt="Wireless headphones">
        </div>
        <h3>Headphones</h3>
        <p style="font-weight: bold;">750.000đ</p>
    </div>
</body>
</html>
